<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
  <!-- Define gradients and filters -->
  <defs>
    <!-- Shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Stronger shadow for emphasis -->
    <filter id="shadow-strong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Gradients -->
    <linearGradient id="grad-success" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4CAF50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#388E3C;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="grad-process" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#42A5F5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1976D2;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="grad-warning" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFA726;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F57C00;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="grad-critical" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#AB47BC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B1FA2;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="grad-error" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#EF5350;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C62828;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="grad-cyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#26C6DA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ACC1;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="grad-decision" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFCA28;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFB300;stop-opacity:1" />
    </linearGradient>
    
    <!-- Arrow markers -->
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333"/>
    </marker>
    <marker id="arrowhead-success" markerWidth="12" markerHeight="12" refX="10" refY="3" orient="auto">
      <polygon points="0 0, 12 3, 0 6" fill="#2E7D32"/>
    </marker>
    <marker id="arrowhead-error" markerWidth="12" markerHeight="12" refX="10" refY="3" orient="auto">
      <polygon points="0 0, 12 3, 0 6" fill="#C62828"/>
    </marker>
    <marker id="arrowhead-warning" markerWidth="12" markerHeight="12" refX="10" refY="3" orient="auto">
      <polygon points="0 0, 12 3, 0 6" fill="#F57C00"/>
    </marker>
  </defs>
  
  <!-- Main container with white background -->
  <rect x="20" y="20" width="1160" height="1460" rx="20" fill="white" opacity="0.98" filter="url(#shadow-strong)"/>
  
  <!-- Title -->
  <text x="600" y="70" font-family="'Segoe UI', Arial, sans-serif" font-size="36" font-weight="bold" fill="#2C3E50" text-anchor="middle">
    Bare.js Deployment Workflow
  </text>
  <line x1="400" y1="85" x2="800" y2="85" stroke="#667eea" stroke-width="3" opacity="0.5"/>
  
  <!-- Success Path -->
  <g id="success-path">
    <!-- Step 1: Lock -->
    <rect x="425" y="120" width="350" height="70" rx="12" fill="url(#grad-success)" filter="url(#shadow)"/>
    <text x="600" y="150" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="bold">
      1. Acquire Deployment Lock
    </text>
    <text x="600" y="172" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="white" text-anchor="middle" opacity="0.95">
      Check and create .deploy.lock
    </text>
    
    <!-- Arrow -->
    <path d="M 600 190 L 600 225" stroke="#34495E" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Step 2: Upload -->
    <rect x="425" y="225" width="350" height="70" rx="12" fill="url(#grad-process)" filter="url(#shadow)"/>
    <text x="600" y="255" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="bold">
      2. Upload &amp; Extract Package
    </text>
    <text x="600" y="277" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="white" text-anchor="middle" opacity="0.95">
      SCP upload → unzip to releases/
    </text>
    
    <!-- Arrow -->
    <path d="M 600 295 L 600 330" stroke="#34495E" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Step 3: Capture Previous -->
    <rect x="425" y="330" width="350" height="70" rx="12" fill="url(#grad-warning)" filter="url(#shadow)"/>
    <text x="600" y="360" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="bold">
      3. Capture Previous Release
    </text>
    <text x="600" y="382" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="white" text-anchor="middle" opacity="0.95">
      readlink current → save for rollback
    </text>
    
    <!-- Arrow -->
    <path d="M 600 400 L 600 435" stroke="#34495E" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Step 4: Update Symlink (CRITICAL) - Highlighted -->
    <g filter="url(#shadow-strong)">
      <rect x="415" y="435" width="370" height="80" rx="12" fill="url(#grad-critical)" stroke="#9C27B0" stroke-width="4"/>
      <text x="600" y="470" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="white" text-anchor="middle" font-weight="bold">
        ⭐ 4. Update 'current' Symlink
      </text>
      <text x="600" y="495" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" opacity="0.95">
        ln -sfn releases/NEW → current
      </text>
      <!-- Emphasis badge -->
      <rect x="740" y="445" width="35" height="20" rx="10" fill="#FFD700"/>
      <text x="757.5" y="459" font-family="'Segoe UI', Arial, sans-serif" font-size="11" fill="#7B1FA2" text-anchor="middle" font-weight="bold">KEY</text>
    </g>
    
    <!-- Arrow -->
    <path d="M 600 515 L 600 550" stroke="#34495E" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Step 5: PostScripts -->
    <rect x="425" y="550" width="350" height="70" rx="12" fill="url(#grad-cyan)" filter="url(#shadow)"/>
    <text x="600" y="580" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="bold">
      5. Run PostScripts
    </text>
    <text x="600" y="602" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="white" text-anchor="middle" opacity="0.95">
      pm2 reload/start (uses NEW release)
    </text>
    
    <!-- Arrow -->
    <path d="M 600 620 L 600 665" stroke="#34495E" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Step 6: Health Check Decision -->
    <g filter="url(#shadow)">
      <polygon points="600,665 710,735 600,805 490,735" fill="url(#grad-decision)" stroke="#FFA000" stroke-width="3"/>
      <text x="600" y="725" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="bold">
        6. Health Check
      </text>
      <text x="600" y="748" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">
        Validates NEW
      </text>
    </g>
    
    <!-- Success Path -->
    <path d="M 710 735 L 825 735 L 825 880 L 775 880" stroke="#2E7D32" stroke-width="4" fill="none" marker-end="url(#arrowhead-success)"/>
    <g filter="url(#shadow)">
      <circle cx="850" cy="735" r="35" fill="#4CAF50"/>
      <text x="850" y="745" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">PASS</text>
    </g>
    
    <!-- Success Box -->
    <rect x="425" y="880" width="350" height="75" rx="12" fill="url(#grad-success)" filter="url(#shadow-strong)"/>
    <text x="600" y="915" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="white" text-anchor="middle" font-weight="bold">
      ✓ Deployment Success!
    </text>
    <text x="600" y="940" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="white" text-anchor="middle" opacity="0.95">
      Release lock, cleanup temp files
    </text>
  </g>
  
  <!-- Failure Path -->
  <g id="failure-path">
    <!-- Failure Arrow -->
    <path d="M 490 735 L 350 735 L 350 1015 L 425 1015" stroke="#C62828" stroke-width="4" fill="none" marker-end="url(#arrowhead-error)"/>
    <g filter="url(#shadow)">
      <circle cx="325" cy="735" r="35" fill="#EF5350"/>
      <text x="325" y="745" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">FAIL</text>
    </g>
    
    <!-- Rollback Decision -->
    <g filter="url(#shadow)">
      <polygon points="600,1015 730,1090 600,1165 470,1090" fill="url(#grad-error)" stroke="#D32F2F" stroke-width="3"/>
      <text x="600" y="1080" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">
        Previous Release
      </text>
      <text x="600" y="1103" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="white" text-anchor="middle" font-weight="bold">
        Exists?
      </text>
    </g>
    
    <!-- YES - Rollback Path -->
    <path d="M 730 1090 L 870 1090" stroke="#F57C00" stroke-width="4" fill="none" marker-end="url(#arrowhead-warning)"/>
    <g filter="url(#shadow)">
      <circle cx="805" cy="1090" r="30" fill="#FF9800"/>
      <text x="805" y="1098" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">YES</text>
    </g>
    
    <rect x="870" y="1030" width="260" height="120" rx="12" fill="url(#grad-warning)" filter="url(#shadow)"/>
    <text x="1000" y="1060" font-family="'Segoe UI', Arial, sans-serif" font-size="17" fill="white" text-anchor="middle" font-weight="bold">
      🔄 Automatic Rollback
    </text>
    <text x="1000" y="1083" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">
      1. Revert symlink
    </text>
    <text x="1000" y="1103" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">
      2. Restart old version
    </text>
    <text x="1000" y="1123" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">
      3. Health check old
    </text>
    <text x="1000" y="1143" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="white" text-anchor="middle">
      4. Cleanup failed release
    </text>
    
    <!-- NO - First Deploy Path -->
    <path d="M 600 1165 L 600 1235" stroke="#C62828" stroke-width="4" fill="none" marker-end="url(#arrowhead-error)"/>
    <g filter="url(#shadow)">
      <circle cx="560" cy="1200" r="30" fill="#F44336"/>
      <text x="560" y="1208" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="bold">NO</text>
    </g>
    
    <rect x="425" y="1235" width="350" height="95" rx="12" fill="url(#grad-error)" filter="url(#shadow)"/>
    <text x="600" y="1270" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="white" text-anchor="middle" font-weight="bold">
      ✗ First Deploy Failed
    </text>
    <text x="600" y="1295" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="white" text-anchor="middle" opacity="0.95">
      No rollback possible
    </text>
    <text x="600" y="1315" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="white" text-anchor="middle" opacity="0.95">
      Check logs &amp; try again
    </text>
    
    <!-- Rollback to Final -->
    <path d="M 1000 1150 L 1000 1380 L 775 1380" stroke="#F57C00" stroke-width="3" fill="none" marker-end="url(#arrowhead-warning)"/>
    
    <!-- Common Cleanup -->
    <rect x="425" y="1360" width="350" height="70" rx="12" fill="#546E7A" filter="url(#shadow)"/>
    <text x="600" y="1390" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="white" text-anchor="middle" font-weight="bold">
      Cleanup &amp; Exit
    </text>
    <text x="600" y="1412" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="white" text-anchor="middle" opacity="0.95">
      Remove failed release, release lock
    </text>
  </g>
  
  <!-- Legend Panel -->
  <g id="legend">
    <rect x="60" y="120" width="280" height="280" rx="15" fill="white" stroke="#E0E0E0" stroke-width="2" filter="url(#shadow)"/>
    <rect x="60" y="120" width="280" height="50" rx="15" fill="#667eea"/>
    <text x="200" y="152" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="white" text-anchor="middle" font-weight="bold">
      Legend
    </text>
    
    <rect x="80" y="190" width="40" height="24" rx="6" fill="url(#grad-success)"/>
    <text x="135" y="207" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#2C3E50">Success Step</text>
    
    <rect x="80" y="230" width="40" height="24" rx="6" fill="url(#grad-process)"/>
    <text x="135" y="247" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#2C3E50">Process Step</text>
    
    <polygon points="100,265 115,275 100,285 85,275" fill="url(#grad-decision)" stroke="#FFA000" stroke-width="2"/>
    <text x="135" y="280" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#2C3E50">Decision Point</text>
    
    <rect x="80" y="300" width="40" height="24" rx="6" fill="url(#grad-warning)"/>
    <text x="135" y="317" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#2C3E50">Rollback Action</text>
    
    <rect x="80" y="340" width="40" height="24" rx="6" fill="url(#grad-error)"/>
    <text x="135" y="357" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#2C3E50">Error/Failure</text>
    
    <rect x="80" y="370" width="40" height="24" rx="6" fill="url(#grad-critical)" stroke="#9C27B0" stroke-width="2"/>
    <text x="135" y="387" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#2C3E50">Critical Step</text>
  </g>
  
  <!-- Key Points Panel -->
  <g id="notes">
    <rect x="60" y="430" width="280" height="200" rx="15" fill="white" stroke="#E0E0E0" stroke-width="2" filter="url(#shadow)"/>
    <rect x="60" y="430" width="280" height="50" rx="15" fill="#42A5F5"/>
    <text x="200" y="462" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="white" text-anchor="middle" font-weight="bold">
      Key Points
    </text>
    
    <text x="80" y="505" font-family="'Segoe UI', Arial, sans-serif" font-size="14" fill="#2C3E50" font-weight="bold">
      ⭐ Critical Change:
    </text>
    <text x="90" y="528" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#546E7A">
      Symlink updated BEFORE
    </text>
    <text x="90" y="548" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#546E7A">
      postScripts run
    </text>
    
    <text x="80" y="575" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#2C3E50">
      ✓ Health check validates
    </text>
    <text x="95" y="595" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#546E7A">
      NEW running code
    </text>
    
    <text x="80" y="615" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#2C3E50">
      🔄 Automatic rollback on
    </text>
    <text x="95" y="635" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#546E7A">
      failure (when possible)
    </text>
  </g>
  
  <!-- UTC Timestamp Panel -->
  <g id="utc-note">
    <rect x="60" y="660" width="280" height="140" rx="15" fill="white" stroke="#E0E0E0" stroke-width="2" filter="url(#shadow)"/>
    <rect x="60" y="660" width="280" height="50" rx="15" fill="#FFA726"/>
    <text x="200" y="692" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="white" text-anchor="middle" font-weight="bold">
      🌍 UTC Timestamps
    </text>
    
    <text x="200" y="730" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#2C3E50" text-anchor="middle">
      Release IDs use UTC to prevent
    </text>
    <text x="200" y="750" font-family="'Segoe UI', Arial, sans-serif" font-size="13" fill="#2C3E50" text-anchor="middle">
      timezone conflicts across teams
    </text>
    <text x="200" y="775" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#7B1FA2" text-anchor="middle" font-weight="bold">
      Format: YYYYMMDDHHmmss
    </text>
  </g>
  
  <!-- Footer -->
  <text x="600" y="1470" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#95a5a6" text-anchor="middle">
    Atomic deployment with zero-downtime rollback capability
  </text>
</svg>